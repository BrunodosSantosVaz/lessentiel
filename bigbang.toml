# Configuração do projeto no Big Bang. Fonte única para as ferramentas do framework.

[bigbang]
version = "3.1.0"
origin = "BrunodosSantosVaz/big-bang"

[project]
mode = "autonomous"
name = "Leitor Limpo"
slug = "mla"
owner = "BrunodosSantosVaz"
repository = "BrunodosSantosVaz/mla"
visibility = "public"
license = "MIT"

[delivery]
profile = "compiled"
target = ""
artifact_paths = ["entrypoints/**", "src/**", "public/**", "wxt.config.ts", "package.json", "package-lock.json", "tsconfig.json"]
version_file = "package.json"
ecosystems = ["npm"]

[compiled]
systems = ["universal"]
build_universal = "npm run package && cp .output/*.zip \"$BB_SAIDA/mla-v${BB_VERSAO}-${BB_SISTEMA}.zip\""

[commands]
affected_tests = ""
install = "npm ci"
lint = "npm run lint"
types = "npm run typecheck"
test = "npm test"
acceptance_test = "npm run test:acceptance"
architecture = "npm run test:architecture"
coverage = "npm run test:coverage"
build = "npm run build"

[tests]
min_coverage = 80
pending_marker = "test.fail"
test_pattern = "(it|test)(\\.fail)?\\("

[security]
asvs_level = "L2"
browser_database = false
sensitive_paths = ["entrypoints/**", "src/**", "wxt.config.ts", "package.json", "package-lock.json"]

[board]
model = "single"
labels = "v3"
number = 33
owner = "BrunodosSantosVaz"

[agents]
names = ["claude-1", "claude-2", "codex-1"]
tasks_per_agent = 1
lease_hours = 24
confirm_seconds = 10

[flags]
max_age_days = 30

[workflow]
model = "grouping"
