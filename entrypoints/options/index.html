<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leitor Limpo</title>
    <script type="module" src="./main.ts"></script>
    <style>
      body { max-width: 680px; margin: 32px auto; padding: 0 20px; color: #17332e; font: 16px/1.5 system-ui, sans-serif; }
      label { display: grid; gap: 6px; margin: 20px 0; }
      input, select, button { box-sizing: border-box; min-height: 44px; padding: 8px 12px; font: inherit; }
      button { border: 0; border-radius: 8px; background: #075e54; color: white; cursor: pointer; }
      li { margin: 8px 0; } li button { margin-left: 12px; }
      :focus-visible { outline: 3px solid #174ea6; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Leitor Limpo</h1>
      <h2 id="heading">Preferências</h2>
      <label><span id="language-label">Idioma</span><select id="language" aria-label="Idioma"><option value="pt-BR">Português (Brasil)</option><option value="en">English</option><option value="es">Español</option></select></label>
      <section id="automatic-settings">
        <h2 id="sites-heading">Ativação automática por site</h2>
        <p id="site-help">A permissão é solicitada somente para o site escolhido.</p>
        <label><span id="site-label">Site</span><input id="site" type="text" placeholder="https://exemplo.com/*" aria-label="Site" /></label>
        <button id="add-site" type="button">Adicionar site automático</button>
        <ul id="sites"></ul>
      </section>
      <p id="status" role="status" aria-live="polite"></p>
      <button id="save" type="button">Salvar preferências</button>
      <p><a id="pdf-link" href="pdf.html">Abrir PDF local</a></p>
    </main>
  </body>
</html>
