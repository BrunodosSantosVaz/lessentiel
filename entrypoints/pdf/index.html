<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leitor Limpo — PDF local</title>
    <script type="module" src="./main.ts"></script>
    <style>
      body { margin: 0; background: #f7f8f6; color: #17332e; font: 16px/1.6 system-ui, sans-serif; }
      header { position: sticky; top: 0; padding: 16px; background: white; border-bottom: 1px solid #65736e; }
      button { min-height: 48px; padding: 8px 16px; border: 0; border-radius: 8px; background: #075e54; color: white; font: inherit; cursor: pointer; }
      :focus-visible { outline: 3px solid #174ea6; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <header><h1>Leitor Limpo</h1><button id="open-pdf" type="button">Abrir PDF local</button><input id="pdf-file" type="file" accept="application/pdf,.pdf" hidden /><p id="status" role="status" aria-live="polite"></p></header>
  </body>
</html>
