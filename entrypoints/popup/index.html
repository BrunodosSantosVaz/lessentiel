<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leitor Limpo</title>
    <script type="module" src="./main.ts"></script>
    <style>
      body { width: 280px; margin: 0; padding: 20px; background: #f7f8f6; color: #17332e; font: 16px/1.5 system-ui, sans-serif; }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { margin: 0 0 16px; color: #50635f; }
      button { width: 100%; min-height: 48px; border: 0; border-radius: 8px; background: #075e54; color: #fff; font: 600 16px system-ui, sans-serif; cursor: pointer; }
      button:focus-visible { outline: 3px solid #174ea6; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Leitor Limpo</h1>
      <p>Abra o texto desta página em uma leitura sem distrações.</p>
      <button type="button" id="activate-reader">Ativar modo de leitura</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
